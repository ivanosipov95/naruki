name: Switch Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to activate (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  switch:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
    steps:
      - name: Validate inputs and FTP secrets
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "version input is required"
            exit 1
          fi
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_REMOTE_PATH" ]; then
            echo "FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_PATH secrets are required"
            exit 1
          fi

      - name: Install lftp
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Switch to release
        run: |
          set -euo pipefail
          RELEASE_DIR="$FTP_REMOTE_PATH/releases/$RELEASE_VERSION"
          ROOT_DIR="$FTP_REMOTE_PATH"
          TMP_DIR="$RUNNER_TEMP/release-$RELEASE_VERSION"
          mkdir -p "$TMP_DIR"

          SSL_SETTINGS=""
          if [ "$FTP_PROTOCOL" = "ftps" ]; then
            SSL_SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true;"
          fi

          lftp -e "
            set cmd:fail-exit true;
            set net:max-retries 2;
            $SSL_SETTINGS
            open -p $FTP_PORT -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            cls \"$RELEASE_DIR\";
            mirror --verbose \"$RELEASE_DIR\" \"$TMP_DIR\";
            mirror -R --delete --verbose \"$TMP_DIR\" \"$ROOT_DIR\";
            bye
          "
